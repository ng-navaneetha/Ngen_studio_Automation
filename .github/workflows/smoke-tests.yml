name: NgenStudio test Report

on:
  schedule:
    - cron: "30 3 * * 1-5"   # 9:00 AM IST, Monday–Friday
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install additional tools
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Run Playwright smoke tests with HTML + JSON report
        id: tests
        continue-on-error: true  # Continue workflow even if tests fail
        run: |
          mkdir -p reports
          ts=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "REPORT_TS=$ts" >> $GITHUB_ENV
          
          # Run tests and capture exit code
          set +e  # Don't exit on error
          npx playwright test --grep @smoke --reporter=json --output-dir="test-results-$ts"
          TEST_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Test execution completed with exit code: $TEST_EXIT_CODE"
          
          # Move reports and handle missing files gracefully
          if [ -d "playwright-report" ]; then
            mv playwright-report "reports/$ts"
          else
            mkdir -p "reports/$ts"
            echo "<h1>Test execution failed</h1><p>Exit code: $TEST_EXIT_CODE</p>" > "reports/$ts/index.html"
          fi
          
          # Look for results.json in multiple locations
          if [ -f "results.json" ]; then
            mv results.json "reports/$ts/results.json"
            echo "✅ Found results.json in root directory"
          elif [ -f "test-results-$ts/results.json" ]; then
            mv "test-results-$ts/results.json" "reports/$ts/results.json"
            echo "✅ Found results.json in test-results directory"
          else
            echo "⚠️ No results.json file found - checking for any JSON files"
            find . -name "*.json" -type f -exec echo "Found JSON file: {}" \;
            
            # Create a basic results file with failure info
            echo "{
              \"stats\": {
                \"expected\": 0,
                \"unexpected\": 1,
                \"flaky\": 0,
                \"skipped\": 0,
                \"duration\": 0,
                \"startTime\": \"$(date -Iseconds)\",
                \"testExecutionFailed\": true,
                \"exitCode\": $TEST_EXIT_CODE
              },
              \"suites\": [],
              \"errors\": [\"Test execution failed with exit code $TEST_EXIT_CODE\"]
            }" > "reports/$ts/results.json"
          fi
          
          # Store exit code for later use
          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> $GITHUB_ENV

      - name: Deploy Playwright reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()  # Always deploy reports, even if tests failed
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true  # keep older reports instead of deleting them

      - name: Parse results and send summary to Teams
        if: always()  # Always send Teams notification, regardless of test outcome
        run: |
          RESULTS_FILE="reports/$REPORT_TS/results.json"
          
          # Always try to find and process results, even if tests failed
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "Primary results file not found, searching for alternatives..."
            
            # Try to find any results file
            FOUND_RESULTS=$(find . -name "results.json" -type f 2>/dev/null | head -1)
            if [ ! -z "$FOUND_RESULTS" ]; then
              echo "Found alternative results file: $FOUND_RESULTS"
              cp "$FOUND_RESULTS" "$RESULTS_FILE"
            else
              echo "No results file found anywhere, sending basic failure notification"
              curl -H 'Content-Type: application/json' \
                -d "{\"text\": \"🚨 **Ngen Studio Test Results**\\n\\n❌ Test execution failed completely\\n\\n**Details:**\\n• Exit Code: ${TEST_EXIT_CODE:-unknown}\\n• No test results generated\\n• Possible causes: Environment issues, setup failures, or critical errors\\n\\n🕐 Time: $(date)\\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
                ${{ secrets.TEAMS_WEBHOOK_URL }}
              exit 0
            fi
          fi
          
          echo "✅ Results file found. First 30 lines:"
          head -30 "$RESULTS_FILE"
          echo "--- End debug info ---"

          # Check if it's a placeholder file (created when tests fail early)
          TOTAL_FROM_STATS=$(jq -r '.stats.expected + .stats.unexpected + .stats.flaky // 0' $RESULTS_FILE 2>/dev/null || echo "0")
          
          if [ "$TOTAL_FROM_STATS" -eq 0 ]; then
            echo "Empty or invalid results file, checking for actual test results"
            # Try the robust method to count actual test results
            ACTUAL_TESTS=$(jq '[.. | objects | select(.status? != null)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
            
            if [ "$ACTUAL_TESTS" -eq 0 ]; then
              echo "No actual test results found, sending failure notification"
              curl -H 'Content-Type: application/json' \
                -d "{\"text\": \"🚨 **Ngen Studio Test Results**\n\n❌ Test execution failed - no test results found\n🕐 Time: $(date)\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
                ${{ secrets.TEAMS_WEBHOOK_URL }}
              exit 0
            fi
          fi

          # Parse test results with robust jq queries that work across Playwright versions
          TOTAL_TESTS=$(jq '[.. | objects | select(.status? != null)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          PASSED_TESTS=$(jq '[.. | objects | select(.status? == "passed")] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          FAILED_TESTS=$(jq '[.. | objects | select(.status? == "failed")] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          FLAKY_TESTS=$(jq '[.. | objects | select(.status? == "flaky")] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          INTERRUPTED_TESTS=$(jq '[.. | objects | select(.status? == "interrupted")] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          SKIPPED_TESTS=$(jq '[.. | objects | select(.status? == "skipped")] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          DURATION=$(jq -r '.stats.duration // 0' $RESULTS_FILE 2>/dev/null || echo "0")
          
          # Check if this was a test execution failure
          EXECUTION_FAILED=$(jq -r '.stats.testExecutionFailed // false' $RESULTS_FILE 2>/dev/null || echo "false")
          EXIT_CODE=$(jq -r '.stats.exitCode // 0' $RESULTS_FILE 2>/dev/null || echo "${TEST_EXIT_CODE:-0}")
          
          # Fallback to stats if robust parsing gives 0 results
          if [ "$TOTAL_TESTS" -eq 0 ]; then
            echo "Falling back to stats-based parsing"
            TOTAL_TESTS=$(jq -r '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped // 0' $RESULTS_FILE 2>/dev/null || echo "0")
            PASSED_TESTS=$(jq -r '.stats.expected // 0' $RESULTS_FILE 2>/dev/null || echo "0")
            FAILED_TESTS=$(jq -r '.stats.unexpected // 0' $RESULTS_FILE 2>/dev/null || echo "0")
            FLAKY_TESTS=$(jq -r '.stats.flaky // 0' $RESULTS_FILE 2>/dev/null || echo "0")
            SKIPPED_TESTS=$(jq -r '.stats.skipped // 0' $RESULTS_FILE 2>/dev/null || echo "0")
          fi
          
          # Calculate total including all states
          ACTUAL_TOTAL=$((PASSED_TESTS + FAILED_TESTS + FLAKY_TESTS + INTERRUPTED_TESTS + SKIPPED_TESTS))
          if [ "$ACTUAL_TOTAL" -gt "$TOTAL_TESTS" ]; then
            TOTAL_TESTS=$ACTUAL_TOTAL
          fi
          
          # Convert duration to seconds
          DURATION_SEC=$(echo "scale=1; $DURATION / 1000" | bc -l 2>/dev/null || echo "0")

          # Determine status and emoji based on comprehensive test results
          if [ "$EXECUTION_FAILED" = "true" ] || [ "$EXIT_CODE" -ne 0 ]; then
            STATUS="🚨 Test Execution Failed (Exit Code: $EXIT_CODE)"
            EMOJI="🚨"
          elif [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -eq 0 ] && [ "$INTERRUPTED_TESTS" -eq 0 ]; then
            STATUS="✅ All Tests Passed"
            EMOJI="🎉"
          elif [ "$FAILED_TESTS" -gt 0 ]; then
            STATUS="❌ Tests Failed"
            EMOJI="🚨"
          elif [ "$INTERRUPTED_TESTS" -gt 0 ]; then
            STATUS="⚠️ Tests Interrupted"
            EMOJI="⚠️"
          else
            STATUS="⚠️ Flaky Tests Detected"
            EMOJI="⚠️"
          fi

          # Get comprehensive test summary with status - try multiple approaches
          summary=$(jq -r '
            .suites[]?.specs[]? | 
            select(.title) |
            "• " + .title + " → " + (.tests[0].results[0].status // "unknown")
          ' $RESULTS_FILE 2>/dev/null | head -20)
          
          # If first approach fails, try extracting just spec titles
          if [ -z "$summary" ]; then
            echo "First approach failed, trying title-only extraction"
            summary=$(jq -r '
              .suites[]?.specs[]? | 
              select(.title) |
              "• " + .title + " (status unknown)"
            ' $RESULTS_FILE 2>/dev/null | head -20)
          fi
          
          # Try to get error information if available
          if [ -z "$summary" ] && [ "$EXECUTION_FAILED" = "true" ]; then
            echo "Extraction failed, checking for error information"
            error_info=$(jq -r '.errors[]? // empty' $RESULTS_FILE 2>/dev/null | head -3)
            if [ ! -z "$error_info" ]; then
              summary=$(echo "$error_info" | sed 's/^/• Error: /')
            fi
          fi
          
          # If still empty, try extracting with broader selector
          if [ -z "$summary" ]; then
            echo "Trying broader extraction for any test-like entries"
            summary=$(jq -r '
              .. | 
              objects | 
              select(.title? and (.title | contains("TC") or contains("@smoke") or contains("test"))) |
              "• " + .title + " (status unknown)"
            ' $RESULTS_FILE 2>/dev/null | head -15)
          fi
          
          # Last resort - show what we know about the failure
          if [ -z "$summary" ]; then
            echo "All extraction approaches failed, creating failure summary"
            if [ "$EXIT_CODE" -ne 0 ]; then
              summary="• Test execution failed with exit code $EXIT_CODE\\n• No individual test results available\\n• Check workflow logs for detailed error information"
            else
              summary="• Tests executed but details unavailable\\n• See full report for more information"
            fi
          fi
          
          # Convert to proper Teams format with line breaks for list items
          summary=$(echo "$summary" | sed ':a;N;$!ba;s/\n/\\n/g')

          # Get failed test details if any - try multiple approaches
          failed_details=""
          if [ "$FAILED_TESTS" -gt 0 ] || [ "$FLAKY_TESTS" -gt 0 ]; then
            failed_details=$(jq -r '
              .suites[]?.specs[]? | 
              select(.tests) |
              select(.tests[0].results[0].status != "passed") |
              "• " + .title + " (" + (.tests[0].results[0].status // "unknown") + ")"
            ' $RESULTS_FILE 2>/dev/null | head -5)
            
            # If first approach fails, try alternative
            if [ -z "$failed_details" ]; then
              failed_details=$(jq -r '
                .. | 
                objects | 
                select(.status? and .status != "passed") |
                "• Test failed (" + (.status // "unknown") + ")"
              ' $RESULTS_FILE 2>/dev/null | head -5)
            fi
            
            # Convert to single line and add header if we have details
            if [ ! -z "$failed_details" ]; then
              failed_details=$(echo "$failed_details" | sed ':a;N;$!ba;s/\n/\\n/g')
              failed_details="\\n\\n**❌ Failed/Flaky Tests:**\\n$failed_details"
            fi
          fi

          latest_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$REPORT_TS/"

          # Build comprehensive summary stats
          SUMMARY_STATS="• Total: $TOTAL_TESTS tests\\n• Passed: $PASSED_TESTS\\n• Failed: $FAILED_TESTS"
          if [ "$FLAKY_TESTS" -gt 0 ]; then
            SUMMARY_STATS="$SUMMARY_STATS\\n• Flaky: $FLAKY_TESTS"
          fi
          if [ "$INTERRUPTED_TESTS" -gt 0 ]; then
            SUMMARY_STATS="$SUMMARY_STATS\\n• Interrupted: $INTERRUPTED_TESTS"
          fi
          if [ "$SKIPPED_TESTS" -gt 0 ]; then
            SUMMARY_STATS="$SUMMARY_STATS\\n• Skipped: $SKIPPED_TESTS"
          fi
          SUMMARY_STATS="$SUMMARY_STATS\\n• Duration: ${DURATION_SEC}s"
          
          # Add execution info if tests failed at execution level
          if [ "$EXIT_CODE" -ne 0 ]; then
            SUMMARY_STATS="$SUMMARY_STATS\\n• Exit Code: $EXIT_CODE"
          fi

          # Send comprehensive Teams message
          curl -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"$EMOJI **Ngen Studio Test Results**\\n\\n**$STATUS**\\n\\n📊 **Summary:**\\n$SUMMARY_STATS\\n\\n📋 **Test Details:**\\n$summary$failed_details\\n\\n📑 [View Full Report]($latest_url)\\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
            }" \
            ${{ secrets.TEAMS_WEBHOOK_URL }}
