name: NgenStudio test Report

on:
  schedule:
    - cron: "30 3 * * 1-5"   # 9:00 AM IST, Monday–Friday
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install additional tools
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Run Playwright smoke tests with HTML + JSON report
        id: tests
        continue-on-error: true  # Continue workflow even if tests fail
        run: |
          mkdir -p reports
          npx playwright test --grep @smoke
          ts=$(date +'%Y-%m-%d_%H-%M-%S')
          
          # Move reports and handle missing files gracefully
          if [ -d "playwright-report" ]; then
            mv playwright-report "reports/$ts"
          else
            mkdir -p "reports/$ts"
          fi
          
          # Playwright generates results.json by default in the current directory
          if [ -f "results.json" ]; then
            cp results.json "reports/$ts/results.json"
            echo "✅ Found and copied results.json"
          else
            echo "⚠️ results.json not found - checking test-results directory"
            if [ -f "test-results/results.json" ]; then
              mkdir -p "reports/$ts"
              cp test-results/results.json "reports/$ts/results.json"
              echo "✅ Found results.json in test-results directory"
            fi
          fi
          
          echo "REPORT_TS=$ts" >> $GITHUB_ENV

      - name: Deploy Playwright reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()  # Always deploy reports, even if tests failed
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true  # keep older reports instead of deleting them

      - name: Parse results and send summary to Teams
        if: always()  # Always send Teams notification, regardless of test outcome
        run: |
          RESULTS_FILE="reports/$REPORT_TS/results.json"
          
          # Check if results file exists
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "❌ Results file not found at $RESULTS_FILE"
            if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
              echo "Warning: TEAMS_WEBHOOK_URL secret not configured"
              exit 0
            fi
            curl -X POST -H 'Content-Type: application/json' \
              -d "{\"text\": \"🚨 **Ngen Studio Test Results**\n\n❌ Test execution completed but no results file found.\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
              "${{ secrets.TEAMS_WEBHOOK_URL }}"
            exit 0
          fi
          
          echo "✅ Results file found. Parsing data..."
          
          # Parse test statistics from results.json
          TOTAL_TESTS=$(jq '[.suites[]?.suites[]?.specs[] // .suites[]?.specs[]] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          PASSED_TESTS=$(jq '[.suites[]?.suites[]?.specs[] // .suites[]?.specs[] | select(.ok == true)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          FAILED_TESTS=$(jq '[.suites[]?.suites[]?.specs[] // .suites[]?.specs[] | select(.ok == false)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          FLAKY_TESTS=$(jq '[.suites[]?.suites[]?.specs[] // .suites[]?.specs[] | select(.flaky == true)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          SKIPPED_TESTS=$(jq '[.suites[]?.suites[]?.specs[] // .suites[]?.specs[] | select(.skipped == true)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
          DURATION=$(jq '.stats.duration // 0' $RESULTS_FILE 2>/dev/null || echo "0")
          
          # Convert duration to seconds and minutes
          DURATION_SEC=$(echo "scale=1; $DURATION / 1000" | bc 2>/dev/null || echo "0")
          DURATION_MIN=$(echo "scale=1; $DURATION / 60000" | bc 2>/dev/null || echo "0")
          
          # Determine status emoji
          if [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -eq 0 ] && [ "$TOTAL_TESTS" -gt 0 ]; then
            STATUS="✅ All Tests Passed"
            EMOJI="🎉"
          elif [ "$FAILED_TESTS" -gt 0 ] && [ "$PASSED_TESTS" -gt 0 ]; then
            STATUS="⚠️ Partial Success"
            EMOJI="⚠️"
          elif [ "$FAILED_TESTS" -gt 0 ]; then
            STATUS="❌ Tests Failed"
            EMOJI="🚨"
          elif [ "$FLAKY_TESTS" -gt 0 ]; then
            STATUS="⚠️ Flaky Tests Detected"
            EMOJI="⚠️"
          else
            STATUS="❓ No Test Results"
            EMOJI="❓"
          fi
          
          # Get test summary - all tests with their status
          summary=$(jq -r '.suites[]?.suites[]?.specs[], .suites[]?.specs[] | select(.title) | if .ok == true then "• " + .title + " → ✅ passed" elif .flaky == true then "• " + .title + " → ⚠️ flaky" else "• " + .title + " → ❌ failed" end' $RESULTS_FILE 2>/dev/null)
          
          # Get only failed/flaky tests for the detailed section
          failed_flaky=$(jq -r '.suites[]?.suites[]?.specs[], .suites[]?.specs[] | select(.title) | select(.ok == false or .flaky == true) | "• " + .title + (if .tests[]?.error?.message then " (" + (.tests[]?.error?.message | split("\n")[0] | .[0:60]) + "...)" else " (unknown issue)" end)' $RESULTS_FILE 2>/dev/null)
          
          # Limit summary to 20 tests
          summary=$(echo "$summary" | head -20)
          
          # Build the Teams message
          message_header="${EMOJI} **Ngen Studio Test Results**"$'\n'"${STATUS}"
          message_summary="📊 Summary: • Total: ${TOTAL_TESTS} • Passed: ${PASSED_TESTS} • Failed: ${FAILED_TESTS} • Flaky: ${FLAKY_TESTS} • Skipped: ${SKIPPED_TESTS} • Duration: ${DURATION_SEC}s (${DURATION_MIN}m)"
          message_tests="📋 Test Details:"$'\n'"${summary}"
          
          # Add failed/flaky details if any
          message_failed=""
          if [ -n "$failed_flaky" ]; then
            message_failed=$'\n'"❌ Failed/Flaky Tests:"$'\n'"${failed_flaky}"
          fi
          
          message_links=$'\n'"📑 View Full Report  🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          # Combine all parts
          full_message="${message_header}"$'\n\n'"${message_summary}"$'\n\n'"${message_tests}${message_failed}${message_links}"
          
          echo "Message to send:"
          echo "$full_message"
          echo "---"
          
          # Send the message to Teams
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "Warning: TEAMS_WEBHOOK_URL secret not configured"
            exit 0
          fi
          
          # Escape the message for JSON and send to Teams
          escaped_message=$(printf '%s\n' "$full_message" | jq -Rs .)
          
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": $escaped_message}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
          
          echo "✅ Message sent to Teams"
