name: NgenStudio test Report

on:
  schedule:
    - cron: "30 3 * * 1-5"   # 9:00 AM IST, Monday–Friday
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install additional tools
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Run Playwright smoke tests with HTML + JSON report
        id: tests
        continue-on-error: true  # Continue workflow even if tests fail
        run: |
          mkdir -p reports
          # Run tests with explicit JSON and HTML reporters to ensure results.json is always generated
          ts=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "Running Playwright tests with @smoke tag"
          
          # Run tests with explicit reporters - capture exit code for later use
          npx playwright test --grep @smoke  || test_exit_code=$?
          echo "Test execution completed with exit code: ${test_exit_code:-0}"
          
          # Move reports and handle missing files gracefully
          if [ -d "playwright-report" ]; then
            mkdir -p "reports/$ts"
            cp -r playwright-report/* "reports/$ts/"
            echo "HTML report copied to reports/$ts"
          else
            mkdir -p "reports/$ts"
            echo "<html><body><h1>Test Execution Failed</h1><p>No HTML report was generated. Please check the workflow logs for details.</p></body></html>" > "reports/$ts/index.html"
            echo "Created basic HTML page in reports/$ts/index.html"
          fi
          
          # Copy (don't move) results.json to ensure it remains available
          if [ -f "results.json" ]; then
            echo "Found results.json in root directory"
            cp results.json "reports/$ts/results.json"
            echo "Copied results.json to reports/$ts/results.json"
          else
            echo "No results.json file found - tests may have failed during execution"
            # Create a more detailed minimal results file for failed execution as a single line JSON
            # to avoid YAML parsing issues with heredoc
            # Default duration if test_exit_code isn't set
            if [ -z "$test_exit_code" ]; then
              DURATION=15000
            else
              DURATION=30000
            fi
            ERROR_MSG="Test execution failed with exit code ${test_exit_code:-unknown}. Check workflow logs for details."
            
            echo "{\"stats\":{\"expected\":0,\"unexpected\":1,\"flaky\":0,\"skipped\":0,\"duration\":$DURATION},\"suites\":[{\"title\":\"Test Execution\",\"suites\":[{\"title\":\"Smoke Tests\",\"specs\":[{\"title\":\"Test execution process\",\"ok\":false,\"tests\":[{\"title\":\"Smoke test execution\",\"ok\":false,\"results\":[{\"status\":\"failed\",\"errors\":[{\"message\":\"$ERROR_MSG\"}]}]}]}]}]}]}" > "reports/$ts/results.json"
            
            echo "Created detailed results.json with proper structure in reports/$ts/results.json"
          fi
          
          echo "REPORT_TS=$ts" >> $GITHUB_ENV

      - name: Deploy Playwright reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()  # Always deploy reports, even if tests failed
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true  # keep older reports instead of deleting them

      - name: Parse results and send summary to Teams
        if: always()  # Always send Teams notification, regardless of test outcome
        run: |
          RESULTS_FILE="reports/$REPORT_TS/results.json"
          
          # Check if results file exists and has actual test data
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "Results file not found, creating minimal results file with failure data"
            # Create a minimal results file that includes failed test information
            mkdir -p "reports/$REPORT_TS"
            echo '{"stats":{"expected":0,"unexpected":1,"flaky":0,"skipped":0,"duration":0},"suites":[{"title":"Test Execution","suites":[{"title":"Smoke Tests","specs":[{"title":"Test execution process","ok":false,"tests":[{"results":[{"status":"failed","errors":[{"message":"Test execution failed - results.json could not be generated. Check logs for details."}]}]}]}]}]}]}' > "$RESULTS_FILE"
            echo "Created minimal results file with failure information"
            # Continue execution to use this minimal file
          fi
          
          echo "✅ Results file found. First 30 lines:"
          head -30 "$RESULTS_FILE"
          echo "--- End debug info ---"

          # Check if we have valid test data, but don't exit if tests failed
          TOTAL_FROM_STATS=$(jq -r '.stats.expected + .stats.unexpected + .stats.flaky // 0' $RESULTS_FILE 2>/dev/null || echo "0")
          
          if [ "$TOTAL_FROM_STATS" -eq 0 ]; then
            echo "Warning: Stats section may be empty or invalid, checking for actual results"
            # Try the robust method to count actual test results
            ACTUAL_TESTS=$(jq '[.. | objects | select(.status? != null)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
            
            if [ "$ACTUAL_TESTS" -eq 0 ]; then
              echo "Warning: No actual test results found, but will continue with report generation"
              # We'll continue processing with default values from our fallback results file
              # This avoids exiting and ensures we still get a Teams notification
            fi
          fi

          # Use stats-based parsing to match HTML report exactly
          TOTAL_TESTS=$(jq -r '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' $RESULTS_FILE)
          PASSED_TESTS=$(jq -r '.stats.expected // 0' $RESULTS_FILE)
          FAILED_TESTS=$(jq -r '.stats.unexpected // 0' $RESULTS_FILE)
          FLAKY_TESTS=$(jq -r '.stats.flaky // 0' $RESULTS_FILE)
          SKIPPED_TESTS=$(jq -r '.stats.skipped // 0' $RESULTS_FILE)
          DURATION=$(jq -r '.stats.duration // 0' $RESULTS_FILE)
          
          # Convert duration to seconds and minutes using jq for better reliability  
          DURATION_SEC=$(jq -r "(.stats.duration // 0) / 1000 * 10 | floor / 10" $RESULTS_FILE)
          DURATION_MIN=$(jq -r "(.stats.duration // 0) / 60000 * 10 | floor / 10" $RESULTS_FILE)

          # Determine status and emoji
          if [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -eq 0 ]; then
            STATUS="✅ All Tests Passed"
            EMOJI="🎉"
          elif [ "$FAILED_TESTS" -gt 0 ]; then
            STATUS="❌ Tests Failed ($FAILED_TESTS/$TOTAL_TESTS)"
            EMOJI="🚨"
          else
            STATUS="⚠️ Flaky Tests Detected"
            EMOJI="⚠️"
          fi

          # Get test summary with status - using correct spec-based approach
          summary=$(jq -r '
            .suites[].suites[]?.specs[] // empty | 
            select(.title) |
            if .ok == true and (.tests[].results | map(.status) | all(. == "passed")) then
              "• " + .title + " → ✅ passed"
            elif .ok == false or (.tests[].results | map(.status) | any(. == "failed")) then
              "• " + .title + " → ❌ failed"  
            elif .ok == true and (.tests[].results | map(.status) | any(. == "flaky")) then
              "• " + .title + " → ⚠️ flaky"
            else
              "• " + .title + " → ❓ unknown"
            end
          ' $RESULTS_FILE 2>/dev/null | head -15)
          
          # Fallback to simple spec listing if complex status parsing fails
          if [ -z "$summary" ]; then
            echo "Complex status parsing failed, falling back to simple spec listing"
            summary=$(jq -r '
              .suites[].suites[]?.specs[] // empty | 
              select(.title) |
              "• " + .title
            ' $RESULTS_FILE 2>/dev/null | head -15)
          fi
          
          # If we still have no summary, create a basic one
          if [ -z "$summary" ]; then
            echo "All spec parsing failed, using fallback summary"
            summary="• Tests executed - see full report for details"
          fi
          
          # Convert to proper Teams format with line breaks for list items
          summary=$(echo "$summary" | sed ':a;N;$!ba;s/\n/\\n/g')

          # Get failed test details if any - using spec-based approach with error messages
          failed_details=""
          if [ "$FAILED_TESTS" -gt 0 ] || [ "$FLAKY_TESTS" -gt 0 ]; then
            # Get failed/flaky tests with more detailed error messages
            failed_details=$(jq -r '
              .suites[].suites[]?.specs[] // empty | 
              select(.title) |
              select(.ok == false or 
                     (.tests[].results | map(.status) | any(. == "failed" or . == "flaky"))) |
              if (.tests[].results | map(.status) | any(. == "failed")) then
                "• " + .title + " (failed)" + 
                (if (.tests[].results[].errors[0].message | length > 0) then
                  "\\n  Error: " + (.tests[].results[].errors[0].message | tostring | .[0:150] + if (length > 150) then "..." else "" end)
                else "" end)
              elif (.tests[].results | map(.status) | any(. == "flaky")) then
                "• " + .title + " (flaky)" +
                (if (.tests[].results[].errors[0].message | length > 0) then 
                  "\\n  Info: " + (.tests[].results[].errors[0].message | tostring | .[0:150] + if (length > 150) then "..." else "" end)
                else "" end)
              else
                "• " + .title + " (unknown issue)"
              end
            ' $RESULTS_FILE 2>/dev/null | head -10)
            
            # Convert to single line and add header if we have details
            if [ ! -z "$failed_details" ]; then
              failed_details=$(echo "$failed_details" | sed ':a;N;$!ba;s/\n/\\n/g')
              failed_details="\\n\\n**❌ Failed/Flaky Tests:**\\n$failed_details"
            fi
          fi

          latest_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$REPORT_TS/"

          # Get current time for reporting
          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          
          # Get workflow trigger information
          if [ "${{ github.event_name }}" == "push" ]; then
            TRIGGER_INFO="Push to ${{ github.ref_name }} by ${{ github.actor }}"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            TRIGGER_INFO="Pull Request by ${{ github.actor }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TRIGGER_INFO="Manual trigger by ${{ github.actor }}"
          else
            TRIGGER_INFO="${{ github.event_name }} event"
          fi
          
          # Send comprehensive Teams message
          curl -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"$EMOJI **Ngen Studio Test Results**\\n\\n**$STATUS**\\n\\n📊 **Summary:**\\n• Total: $TOTAL_TESTS tests\\n• Passed: $PASSED_TESTS\\n• Failed: $FAILED_TESTS\\n• Flaky: $FLAKY_TESTS\\n• Skipped: $SKIPPED_TESTS\\n• Duration: ${DURATION_SEC}s (${DURATION_MIN}m)\\n\\n📋 **Test Details:**\\n$summary$failed_details\\n\\n📑 [View Full Report]($latest_url)\\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\\n\\n🕒 **Run:** $CURRENT_DATE\\n👤 **Trigger:** $TRIGGER_INFO\"
            }" \
            ${{ secrets.TEAMS_WEBHOOK_URL }}
